    opacity 0.55s ease,
    transform 0.55s ease;
}

/* الصورة المقصوصة فوق */
.red-shirt-cutout {
  position: absolute;
  inset: 0;
  z-index: 4;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  pointer-events: none;
  filter:
    contrast(1.04)
    drop-shadow(0 0 12px rgba(0, 0, 0, 0.82))
    drop-shadow(0 0 18px rgba(90, 0, 0, 0.28));
  transition:
    transform 0.75s ease,
    filter 0.55s ease;
}

/* عند مرور الماوس */
.red-shirt-banner:hover {
  transform: translateY(-4px) scale(1.008);
  box-shadow:
    0 24px 60px rgba(0, 0, 0, 0.78),
    0 0 0 1px rgba(255, 255, 255, 0.08),
    0 0 42px rgba(130, 0, 0, 0.32);
}

.red-shirt-banner:hover .red-shirt-bg {
  transform: scale(1.035);
  filter: brightness(0.46) contrast(1.16) saturate(0.95);
}

.red-shirt-banner:hover .red-shirt-dark-focus {
  opacity: 0.92;
  animation-duration: 4.8s;
}

.red-shirt-banner:hover .red-shirt-shadow-glow {
  opacity: 0.9;
  transform: scale(1.06);
}

.red-shirt-banner:hover .red-shirt-cutout {
  transform: scale(1.025);
  filter:
    contrast(1.1)
    brightness(1.04)
    drop-shadow(0 0 16px rgba(0, 0, 0, 1))
    drop-shadow(0 0 26px rgba(120, 0, 0, 0.38));
}

.red-shirt-banner:active {
  transform: scale(0.988);
}

/* نبض الظلام التلقائي */
@keyframes redShirtDarkPulse {
  0%, 100% {
    opacity: 0.55;
  }

  50% {
    opacity: 0.78;
  }
}

/* نبض الظل خلف الشخصية */
@keyframes redShirtShadowPulse {
  0%, 100% {
    opacity: 0.42;
    transform: scale(1);
  }

  50% {
    opacity: 0.7;
    transform: scale(1.04);
  }
}

@media (max-width: 768px) {
  .red-shirt-section {
    padding: 16px 10px;
  }

  .red-shirt-banner {
    border-radius: 16px;
  }

  .red-shirt-shadow-glow {
    filter: blur(15px);
  }
